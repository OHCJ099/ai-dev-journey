<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>week07 · 聊天页（参考实现）</title>
</head>
<body>
  <h3>week07 聊天页（流式 · 参考实现）</h3>

  <div id="messages" style="border: 1px solid #999; padding: 8px; min-height: 200px"></div>
  <input id="input" type="text" placeholder="输入消息，按回车发送" style="width: 60%" />
  <button id="send">发送</button>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    const history = [];

    function addBubble(text) {
      const div = document.createElement("div");
      div.textContent = text;
      messagesEl.appendChild(div);
      return div;
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = "";

      addBubble("我：" + text);
      history.push({ role: "user", content: text });

      const resp = await fetch("/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      const replyEl = addBubble("AI：");
      let buffer = "";
      let replyText = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        // 空位 1 的填法：
        const parts = buffer.split("\n\n");
        buffer = parts.pop(); // 最后一段不完整，留回筐里
        for (const part of parts) {
          if (!part.startsWith("data: ")) continue;
          const piece = part.slice(6);
          if (piece === "[DONE]") continue;
          replyText += piece;
          replyEl.textContent = "AI：" + replyText;
        }
      }

      // 空位 2 的填法：
      history.push({ role: "assistant", content: replyText });
    }

    sendBtn.addEventListener("click", send);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") send();
    });
  </script>
</body>
</html>
