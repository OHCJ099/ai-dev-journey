<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="title desc">
  <title id="title">鹈鹕骑自行车</title>
  <desc id="desc">一只戴着青绿色头盔、系着珊瑚红围巾的白鹈鹕，伸出翅膀扶着车把，用橙色蹼足踩着青绿色自行车的踏板。奶油色背景中有太阳、白云和小草。</desc>
  <defs>
    <g id="wheel">
      <circle r="140" fill="#fffdf6" stroke="#293f48" stroke-width="13"/>
      <circle r="126" fill="none" stroke="#c8ddd3" stroke-width="4"/>
      <path d="M-121 0H121 M0-121V121 M-105-60.5L105 60.5 M-60.5-105L60.5 105 M-105 60.5L105-60.5 M-60.5 105L60.5-105" fill="none" stroke="#a3bcb3" stroke-width="2.5"/>
      <circle r="13" fill="#d5e5dc" stroke="#293f48" stroke-width="5"/>
      <circle r="4" fill="#293f48"/>
    </g>
    <path id="frame" d="M286 615L445 452L525 610Z M445 452H705L525 610 M705 452L724 508L819 615"/>
    <path id="fenders" d="M154 545A153 153 0 0 1 381 496 M711 501A153 153 0 0 1 964 569"/>
  </defs>

  <!-- A quiet coastal morning. -->
  <rect width="1120" height="820" fill="#f7f2e6"/>
  <circle cx="946" cy="151" r="61" fill="#f3ca73"/>
  <circle cx="946" cy="151" r="77" fill="none" stroke="#eddcb6" stroke-width="2" stroke-dasharray="2 12" stroke-linecap="round"/>
  <g fill="#fffdf8">
    <path d="M133 206C117 205 115 184 131 178C131 154 162 146 178 164C193 139 230 148 233 177C258 169 274 190 263 205Z"/>
    <path d="M746 131C735 128 735 114 747 110C749 92 773 87 785 100C799 91 819 101 818 115C836 111 847 126 836 133Z"/>
  </g>
  <g fill="none" stroke="#b9cdc2" stroke-width="5" stroke-linecap="round">
    <path d="M163 302H240 M189 337H258 M148 371H235"/>
    <path d="M865 389q14-14 28 0q14-14 28 0" stroke-width="3"/>
  </g>
  <ellipse cx="556" cy="765" rx="410" ry="20" fill="#d9e1ce"/>
  <path d="M113 757H1002" fill="none" stroke="#a9b9a1" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#849e89" stroke-width="3" stroke-linecap="round" fill="#a7bea0">
    <path d="M123 756v-28m0 15q-22-1-22-17q20 1 22 17m1 5q19-1 21-17q-18 0-21 17"/>
    <path d="M986 756v-34m0 14q-19-1-21-16q20 2 21 16m1 11q23-2 24-19q-20 1-24 19"/>
  </g>

  <!-- Wheels, far pedal, and the far leg. -->
  <use href="#wheel" x="286" y="615"/>
  <use href="#wheel" x="819" y="615"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use href="#fenders" stroke="#293f48" stroke-width="11"/>
    <use href="#fenders" stroke="#69b8ad" stroke-width="6"/>
    <path d="M525 610L466 574" stroke="#526b6e" stroke-width="9"/>
    <path d="M444 583H489" stroke="#293f48" stroke-width="10"/>
  </g>
  <g fill="#dfa15f" stroke="#293f48" stroke-width="5.5" stroke-linejoin="round">
    <path d="M423 423L402 473Q396 486 410 502L451 560L468 551L429 489L447 436Z"/>
    <path d="M451 553L467 556L484 567L502 577L480 578L474 583L460 578L447 576L441 567Z"/>
  </g>

  <!-- A classic diamond-frame bicycle. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M286 603L525 582A28 28 0 0 1 525 638L286 627A12 12 0 0 1 286 603Z" fill="none" stroke="#738f89" stroke-width="4"/>
    <g fill="none">
      <use href="#frame" stroke="#293f48" stroke-width="19"/>
      <use href="#frame" stroke="#55aaa4" stroke-width="11"/>
      <path d="M450 460L440 432 M705 452L683 393Q683 384 697 383L716 383" stroke="#293f48" stroke-width="13"/>
      <path d="M450 460L440 432 M705 452L683 393Q683 384 697 383L716 383" stroke="#a7c7bc" stroke-width="6"/>
      <path d="M684 392H637" stroke="#293f48" stroke-width="13"/>
      <path d="M681 403Q755 447 724 508" stroke="#526d6c" stroke-width="3"/>
    </g>
    <path d="M413 431Q442 422 478 435Q488 438 484 447H413Q401 442 413 431Z" fill="#293f48" stroke="#293f48" stroke-width="4"/>
    <path d="M421 434Q448 429 474 439" fill="none" stroke="#627c78" stroke-width="3"/>
    <circle cx="525" cy="610" r="29" fill="#e9ecdf" stroke="#293f48" stroke-width="6"/>
    <circle cx="525" cy="610" r="19" fill="none" stroke="#9aafa5" stroke-width="3"/>
    <path d="M525 610L584 646" fill="none" stroke="#293f48" stroke-width="10"/>
    <path d="M525 610L584 646" fill="none" stroke="#b7d4c8" stroke-width="4"/>
    <circle cx="525" cy="610" r="6" fill="#293f48"/>
    <path d="M561 654H610" fill="none" stroke="#293f48" stroke-width="11"/>
    <path d="M569 650H603" fill="none" stroke="#7e9690" stroke-width="3"/>
    <circle cx="819" cy="615" r="6" fill="#293f48"/>
  </g>

  <!-- The near leg is bent around the pedal stroke. -->
  <g fill="#f0b266" stroke="#293f48" stroke-width="5.5" stroke-linejoin="round">
    <path d="M470 423C496 437 539 456 555 481Q565 494 560 512L541 570Q538 580 548 591L578 619L564 633L526 596Q514 582 520 562L537 502L464 450Z"/>
    <path d="M567 617L588 625Q600 627 609 634L630 639L610 644L615 651L590 647L582 653L568 641L560 630Z"/>
    <path d="M587 633L610 644M578 637L590 647" fill="none" stroke="#c58248" stroke-width="2.5"/>
  </g>

  <!-- The scarf tails sit behind the bird. -->
  <path d="M513 302L447 274L458 299L421 306L487 326L518 315Z" fill="#de7761" stroke="#293f48" stroke-width="5" stroke-linejoin="round"/>
  <path d="M464 299L491 310" fill="none" stroke="#f2a084" stroke-width="4" stroke-linecap="round"/>

  <!-- Pelican silhouette: white body, long curved neck, broad bill. -->
  <path d="M344 335L301 316L320 348L286 347L322 371L305 385L355 384C364 416 399 436 444 443C493 454 534 438 562 410C585 386 595 355 614 333C632 313 652 295 663 272C675 245 663 214 642 198C622 180 590 181 569 195C550 208 549 231 537 254C524 279 505 299 480 316C429 294 379 300 344 335Z" fill="#fffdf7" stroke="#293f48" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M353 382C394 412 434 427 479 426C522 426 556 400 579 367C564 416 516 449 461 442C413 439 378 421 353 382Z" fill="#e8eadf"/>
  <path d="M325 351L351 366M329 375L357 374" fill="none" stroke="#bac9bf" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Neck scarf and helmet strap. -->
  <path d="M520 284Q535 296 551 301L535 322Q520 316 504 307Z" fill="#e6866c" stroke="#293f48" stroke-width="5" stroke-linejoin="round"/>
  <path d="M530 297L519 311" fill="none" stroke="#f8b69a" stroke-width="4" stroke-linecap="round"/>
  <path d="M557 223Q554 252 582 268L596 257" fill="none" stroke="#293f48" stroke-width="5" stroke-linecap="round"/>
  <rect x="577" y="257" width="12" height="12" rx="3" fill="#69b8ad" stroke="#293f48" stroke-width="3" transform="rotate(21 583 263)"/>

  <!-- The characteristic elastic throat pouch and long upper bill. -->
  <path d="M660 264L937 272Q871 334 793 333Q712 331 661 285Z" fill="#eda16e" stroke="#293f48" stroke-width="5.5" stroke-linejoin="round"/>
  <path d="M704 286Q789 326 892 287" fill="none" stroke="#f8bd85" stroke-width="9" stroke-linecap="round"/>
  <path d="M657 244L914 256Q941 258 956 272L665 276Z" fill="#f5c36a" stroke="#293f48" stroke-width="5.5" stroke-linejoin="round"/>
  <path d="M674 263L931 270" fill="none" stroke="#c18b4e" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M698 253L712 254" fill="none" stroke="#8c683e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="629" cy="230" r="7.5" fill="#293f48"/>
  <circle cx="631" cy="228" r="2.2" fill="#fffdf7"/>
  <path d="M614 214Q625 210 635 215" fill="none" stroke="#293f48" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="614" cy="252" rx="10" ry="6" fill="#f2d5b7"/>

  <!-- Lightweight teal cycling helmet. -->
  <path d="M549 211C550 184 570 163 596 158C628 152 657 173 666 205L659 220Q609 201 555 227Z" fill="#62b5ab" stroke="#293f48" stroke-width="6" stroke-linejoin="round"/>
  <path d="M559 211C587 193 628 193 655 209" fill="none" stroke="#b8ded0" stroke-width="5" stroke-linecap="round"/>
  <path d="M582 177L575 190M605 169L600 184M633 180L627 192" fill="none" stroke="#2f6869" stroke-width="6" stroke-linecap="round"/>

  <!-- A folded flight wing reaches the handlebar. -->
  <path d="M376 338C410 320 463 328 508 358L573 382L633 382Q647 379 650 390L647 397L635 397L626 407L614 408L607 415L591 418C558 417 535 407 508 393C462 396 416 375 376 338Z" fill="#e1e7dc" stroke="#293f48" stroke-width="5.5" stroke-linejoin="round"/>
  <path d="M508 358L573 382L633 382Q647 379 650 390L647 397L635 397L626 407L614 408L607 415L591 418C558 417 535 407 508 393Q527 380 508 358Z" fill="#41585c"/>
  <g fill="none" stroke-linecap="round">
    <path d="M399 344Q441 349 481 377M421 337Q457 346 493 367" stroke="#b5c6b9" stroke-width="3.5"/>
    <path d="M579 395L632 390M584 404L620 399" stroke="#829890" stroke-width="3"/>
  </g>
</svg>
